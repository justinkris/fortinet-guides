<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EF-NSE7 2.0 — Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,400&family=Epilogue:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:      #fff5f5;
    --cream-dark: #fde8e8;
    --ink:        #1a0606;
    --ink-soft:   #4a1212;
    --ink-muted:  #8a3a3a;
    --red:        #c0392b;
    --red-vivid:  #e03e2d;
    --red-light:  #fef2f2;
    --red-border: #f8b4b4;
    --border:     #f0c8c8;
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Epilogue', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 40px 60px;
  }

  /* ── HEADER ── */
  .page-header { text-align: center; margin-bottom: 56px; }
  .name-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--ink); color: var(--cream);
    padding: 6px 16px; border-radius: 20px;
    font-size: 11px; letter-spacing: 0.18em; margin-bottom: 18px;
    text-transform: uppercase;
  }
  .name-tag-dot { width: 5px; height: 5px; background: var(--red-vivid); border-radius: 50%; }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 56px; font-weight: 700;
    line-height: 1.0; color: var(--ink); letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; font-weight: 400; color: var(--red); }
  .subtitle {
    font-family: 'Fraunces', serif; font-style: italic;
    font-size: 22px; color: var(--ink-muted); margin-top: 8px; font-weight: 400;
  }

  /* ── BACK LINK ── */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 28px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-muted); text-decoration: none;
    padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.6);
    transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
  }
  .back-link:hover { color: var(--red); border-color: var(--red-border); background: var(--red-light); transform: translateX(-3px); }

  /* ── CARD GRID ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(280px, 380px));
    gap: 22px;
    width: 100%;
    justify-content: center;
  }

  .hub-card {
    position: relative;
    background: var(--ink);
    border: 2px solid #2e0c0c;
    border-radius: 24px;
    padding: 36px 32px 28px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    min-height: 240px;
    will-change: transform;
    transition:
      transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.4s ease,
      border-color 0.3s ease,
      background 0.35s ease;
  }

  .hub-card::before {
    content: ''; position: absolute;
    top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.06) 50%, transparent);
    transform: skewX(-15deg); pointer-events: none; z-index: 2;
  }
  @keyframes card-shine { to { left: 160%; } }

  .hub-card:hover::before { animation: card-shine 0.55s ease forwards; }
  .hub-card:hover {
    transform: translateY(-14px) scale(1.025);
    background: #260808;
    border-color: var(--red);
    box-shadow: 0 32px 64px rgba(192,57,43,0.4), 0 0 0 2px rgba(192,57,43,0.2);
  }

  /* Icon */
  .card-icon {
    position: absolute;
    top: 24px; right: 26px;
    width: 50px; height: 50px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(192,57,43,0.18);
    border: 1.5px solid rgba(192,57,43,0.36);
    color: #e87070;
    z-index: 4;
    transition: background 0.3s, border-color 0.3s, color 0.3s,
                box-shadow 0.4s,
                transform 0.5s cubic-bezier(0.15, 0.85, 0.2, 1.2);
  }
  .hub-card:hover .card-icon {
    background: var(--red);
    border-color: var(--red-vivid);
    color: #fff;
    box-shadow: 0 8px 28px rgba(192,57,43,0.55);
    transform: scale(1.1) rotate(-8deg);
  }

  .card-content { position: relative; z-index: 3; display: flex; flex-direction: column; flex: 1; }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 32px; font-weight: 700;
    line-height: 1.05; letter-spacing: -0.02em;
    color: #fff;
    padding-right: 70px;
    transition: color 0.35s ease;
  }
  .hub-card:hover .card-title { color: var(--red-vivid); }

  .card-desc {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
    font-size: 15px; color: rgba(255,255,255,0.42);
    margin-top: 10px; line-height: 1.45;
    transition: color 0.4s ease;
  }
  .hub-card:hover .card-desc { color: rgba(255,255,255,0.65); }

  .card-spacer { flex: 1; min-height: 28px; }

  .card-divider {
    height: 1px;
    background: rgba(192,57,43,0.18);
    margin-bottom: 18px;
    transition: background 0.3s;
  }
  .hub-card:hover .card-divider { background: rgba(192,57,43,0.4); }

  .card-footer {
    display: flex; align-items: center; justify-content: flex-end;
  }
  .card-cta {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: 100px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(192,57,43,0.22);
    border: 1.5px solid rgba(192,57,43,0.42);
    color: #e87070;
    transition: background 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
  }
  .card-cta .cta-arrow {
    display: inline-block;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hub-card:hover .card-cta {
    background: var(--red);
    border-color: var(--red-vivid);
    color: #fff;
    box-shadow: 0 6px 20px rgba(192,57,43,0.52);
  }
  .hub-card:hover .card-cta .cta-arrow { transform: translateX(4px); }

  @keyframes pageEnter {
    from { opacity: 0; transform: scale(1.05) translateY(-25px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  body { animation: pageEnter 0.6s cubic-bezier(0.15, 0.85, 0.2, 1.08) both; }

  footer {
    margin-top: 80px; font-size: 11px;
    letter-spacing: 0.12em; color: var(--ink-muted); text-transform: uppercase;
  }
  footer span { color: var(--red); }

  @media (max-width: 760px) {
    .card-grid { grid-template-columns: 1fr; max-width: 420px; }
    h1 { font-size: 40px; }
    body { padding: 60px 24px; }
  }
</style>
</head>
<body>

  <a class="back-link" href="../index.html">← All Guides</a>

  <div class="page-header">
    <div class="name-tag">
      <span class="name-tag-dot"></span>
      EF-NSE7 · v2.0
    </div>
    <h1>NSE7 <em>2.0</em></h1>
    <div class="subtitle">Sessions &amp; Audio</div>
  </div>

  <div class="card-grid">

    <a class="hub-card" href="socratic-sessions/index.html">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <line x1="8" y1="10" x2="16" y2="10"/>
          <line x1="8" y1="14" x2="13" y2="14"/>
        </svg>
      </div>
      <div class="card-content">
        <div class="card-title">Socratic Sessions</div>
        <div class="card-desc">Dialogue-driven study, one question at a time.</div>
        <div class="card-spacer"></div>
        <div class="card-divider"></div>
        <div class="card-footer">
          <div class="card-cta"><span>Open</span><span class="cta-arrow">→</span></div>
        </div>
      </div>
    </a>

    <a class="hub-card" href="audio-podcasts/index.html">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="17" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </div>
      <div class="card-content">
        <div class="card-title">Audio Podcasts</div>
        <div class="card-desc">Listen on the move — chapter recaps and deep dives.</div>
        <div class="card-spacer"></div>
        <div class="card-divider"></div>
        <div class="card-footer">
          <div class="card-cta"><span>Open</span><span class="cta-arrow">→</span></div>
        </div>
      </div>
    </a>

  </div>

  <footer>
    Network Security<span>.</span> Built for a world that demands enterprise-grade defense<span>.</span>
  </footer>

</body>
</html>
