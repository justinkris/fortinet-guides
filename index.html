<!DOCTYPE html>
<html lang="en">
<head>
<script>if(sessionStorage.getItem('pt')){document.documentElement.classList.add('pt-init')}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Francisco — Fortinet Guides</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,400&family=Epilogue:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:      #fff5f5;
    --cream-dark: #fde8e8;
    --ink:        #1a0606;
    --ink-soft:   #4a1212;
    --ink-muted:  #8a3a3a;
    --red:        #c0392b;
    --red-vivid:  #e03e2d;
    --red-light:  #fef2f2;
    --red-border: #f8b4b4;
    --border:     #f0c8c8;
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html.pt-init body { opacity:0; }

  body {
    font-family: 'Epilogue', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 40px 60px;
  }

  /* ── HEADER ── */
  .page-header { text-align: center; margin-bottom: 64px; }
  .name-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--ink); color: var(--cream);
    padding: 6px 16px; border-radius: 20px;
    font-size: 11px; letter-spacing: 0.18em; margin-bottom: 18px;
    text-transform: uppercase;
  }
  .name-tag-dot { width: 5px; height: 5px; background: var(--red-vivid); border-radius: 50%; }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 56px; font-weight: 700;
    line-height: 1.0; color: var(--ink); letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; font-weight: 400; color: var(--red); }
  .subtitle {
    font-family: 'Fraunces', serif; font-style: italic;
    font-size: 22px; color: var(--ink-muted); margin-top: 8px; font-weight: 400;
  }

  /* ── CARD GRID ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(300px, 480px));
    gap: 22px;
    width: 100%;
    justify-content: center;
  }

  /* ── FEATURED CARD ── */
  .course-card {
    position: relative;
    background: var(--ink);
    border: 2px solid #2e0c0c;
    border-radius: 24px;
    padding: 36px 40px 32px;
    grid-column: 1 / -1;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    will-change: transform;
    transition:
      transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.4s ease,
      border-color 0.3s ease,
      background 0.35s ease;
  }

  /* Sheen sweep */
  .course-card::before {
    content: ''; position: absolute;
    top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.06) 50%, transparent);
    transform: skewX(-15deg); pointer-events: none; z-index: 2;
  }
  @keyframes card-shine { to { left: 160%; } }

  /* Glow halo */
  .course-card::after {
    content: ''; position: absolute; inset: -2px; border-radius: 26px;
    transition: box-shadow 0.5s ease, opacity 0.5s ease; pointer-events: none; opacity: 0;
  }

  .course-card:hover::before { animation: card-shine 0.55s ease forwards; }
  .course-card:hover::after  { opacity: 1; }
  .course-card:hover {
    transform: translateY(-16px) scale(1.025);
    background: #260808;
    border-color: var(--red);
    box-shadow: 0 32px 64px rgba(192,57,43,0.4), 0 0 0 2px rgba(192,57,43,0.2);
  }
  .course-card:hover::after { box-shadow: 0 0 80px 20px rgba(192,57,43,0.22); }

  /* ── ICON — absolute top-right ── */
  .cert-icon {
    position: absolute;
    top: 28px; right: 32px;
    width: 54px; height: 54px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(192,57,43,0.18);
    border: 1.5px solid rgba(192,57,43,0.36);
    color: #e87070;
    z-index: 4;
    transition: background 0.3s, border-color 0.3s, color 0.3s,
                box-shadow 0.4s,
                transform 0.5s cubic-bezier(0.15, 0.85, 0.2, 1.2);
  }
  .course-card:hover .cert-icon {
    background: var(--red);
    border-color: var(--red-vivid);
    color: #fff;
    box-shadow: 0 8px 28px rgba(192,57,43,0.55);
    animation: icon-spin 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes icon-spin {
    0%   { transform: scale(1)    rotate(0deg); }
    60%  { transform: scale(1.26) rotate(760deg); }
    80%  { transform: scale(1.16) rotate(712deg); }
    100% { transform: scale(1.18) rotate(720deg); }
  }

  /* ── CARD CONTENT ── */
  .card-content { position: relative; z-index: 3; display: flex; flex-direction: column; flex: 1; }

  .cert-code {
    font-family: 'Fraunces', serif;
    font-size: 52px; font-weight: 700;
    line-height: 1; letter-spacing: -0.02em;
    color: #fff;
    padding-right: 80px; /* clearance for abs icon */
    transition: color 0.35s ease;
  }
  .course-card:hover .cert-code { color: var(--red-vivid); }

  .cert-name {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
    font-size: 16px; color: rgba(255,255,255,0.38);
    margin-top: 8px; line-height: 1.4;
    transition: color 0.4s ease;
  }
  .course-card:hover .cert-name { color: rgba(255,255,255,0.62); }

  /* Spacer pushes footer down */
  .card-spacer { flex: 1; min-height: 32px; }

  /* Divider */
  .card-divider {
    height: 1px;
    background: rgba(192,57,43,0.18);
    margin-bottom: 20px;
    transition: background 0.3s;
  }
  .course-card:hover .card-divider { background: rgba(192,57,43,0.4); }

  /* ── FOOTER ROW ── */
  .card-footer {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }

  /* EF-NSE7 tag */
  .edu-tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 20px; border: 1px solid;
    background: rgba(192,57,43,0.14);
    border-color: rgba(192,57,43,0.32);
    color: #e87070;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  .course-card:hover .edu-tag {
    background: rgba(192,57,43,0.26);
    border-color: rgba(192,57,43,0.52);
    color: #f0a0a0;
  }

  /* Status badge */
  .status-badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 20px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid;
    background: rgba(192,57,43,0.14);
    color: #e87070;
    border-color: rgba(192,57,43,0.32);
    flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--red-vivid);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,62,45,0.6); }
    50%       { box-shadow: 0 0 0 6px rgba(224,62,45,0); }
  }
  .course-card:hover .status-badge {
    background: rgba(192,57,43,0.26);
    border-color: rgba(192,57,43,0.52);
    color: #f0a0a0;
  }

  /* Open Hub CTA — solid red */
  .card-cta {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: 100px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(192,57,43,0.22);
    border: 1.5px solid rgba(192,57,43,0.42);
    color: #e87070;
    margin-left: auto;
    transition: background 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
  }
  .card-cta .cta-arrow {
    display: inline-block;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .course-card:hover .card-cta {
    background: var(--red);
    border-color: var(--red-vivid);
    color: #fff;
    box-shadow: 0 6px 20px rgba(192,57,43,0.52);
  }
  .course-card:hover .card-cta .cta-arrow { transform: translateX(4px); }

  /* ── PAGE ENTER ── */
  @keyframes pageEnter {
    from { opacity: 0; transform: scale(1.05) translateY(-25px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  body { animation: pageEnter 0.6s cubic-bezier(0.15, 0.85, 0.2, 1.08) both; }

  /* ── FOOTER ── */
  footer {
    margin-top: 80px; font-size: 11px;
    letter-spacing: 0.12em; color: var(--ink-muted); text-transform: uppercase;
  }
  footer span { color: var(--red); }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .card-grid { grid-template-columns: 1fr; max-width: 460px; }
    h1 { font-size: 40px; }
    body { padding: 60px 24px; }
    .course-card { padding: 28px 24px 24px; }
    .cert-icon { top: 22px; right: 22px; width: 46px; height: 46px; border-radius: 13px; }
    .cert-code { font-size: 38px; padding-right: 68px; }
  }
</style>
</head>
<body>

  <!-- ── HEADER ── -->
  <div class="page-header">
    <div class="name-tag">
      <span class="name-tag-dot"></span>
      Justin Francisco
    </div>
    <h1>Fortinet <em>Guides</em></h1>
    <div class="subtitle">Road to NSE Mastery</div>
  </div>

  <div class="card-grid">

    <a class="course-card" href="EF-NSE7/index.html">

      <!-- Icon: absolute top-right -->
      <div class="cert-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>

      <div class="card-content">
        <div class="cert-code">NSE7</div>
        <div class="cert-name">Fortinet Enterprise Firewall 7.6</div>
        <div class="card-spacer"></div>
        <div class="card-divider"></div>
        <div class="card-footer">
          <div class="edu-tag">EF-NSE7</div>
          <div class="status-badge"><span class="status-dot"></span>In Progress</div>
          <div class="card-cta"><span class="cta-label">Open Hub</span><span class="cta-arrow">→</span></div>
        </div>
      </div>

    </a>

  </div>

  <footer>
    Network Security<span>.</span> Built for a world that demands enterprise-grade defense<span>.</span>
  </footer>

</body>
</html>
